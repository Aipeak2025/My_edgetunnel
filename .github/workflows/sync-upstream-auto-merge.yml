name: 自动同步上游并自动合并(无冲突)+触发CF部署
on:
  schedule:
    - cron: '0 0 * * *' # UTC 0点，北京时间早上8点定时检查
  workflow_dispatch: # 支持手动点按钮立刻执行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取当前仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 添加上游仓库
        run: |
          git remote add upstream https://github.com/cmliu/edgetunnel.git
          git fetch upstream

      - name: 合并上游main到本地main
        run: |
          git checkout main
          git merge upstream/main --no-ff -m "🤖自动同步上游最新提交"

      - name: 推送回自己仓库
        run: git push origin main

      - name: 调用Cloudflare部署钩子
        uses: fjogeleit/http-request-action@v1
        with:
          url: ${{ secrets.CF_DEPLOY_HOOK }}
          method: 'POST'
